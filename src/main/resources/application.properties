
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8090/realms/travelapp}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://localhost:8090/realms/travelapp/protocol/openid-connect/certs}

# audience e client id attesi nel token: nessun default permissivo, vanno validati sempre
app.security.expected-audience=${SECURITY_EXPECTED_AUDIENCE:travelapp-backend}
app.security.resource-client-id=${SECURITY_RESOURCE_CLIENT_ID:travelapp-backend}

# --- Admin REST API di Keycloak (usata SOLO dalla registrazione self-service) ------------
# Credenziali del service account che crea gli utenti e assegna i ruoli realm. Client
# separato da quello del resource server: sono due identita' con privilegi molto diversi e
# vanno poter essere ruotate/revocate in modo indipendente.
# Il secret NON ha un default: senza KEYCLOAK_ADMIN_CLIENT_SECRET l'applicazione parte
# normalmente e solo la registrazione risponde 503, con un log che dice cosa manca. Un
# default "di comodo" finirebbe invece in produzione senza che nessuno se ne accorga.
app.keycloak.admin.base-url=${KEYCLOAK_BASE_URL:http://localhost:8090}
app.keycloak.admin.realm=${KEYCLOAK_REALM:travelapp}
app.keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:travelapp-registration}
app.keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
# timeout stretti: la registrazione e' pubblica, una Keycloak che non risponde non deve
# tenere occupati i thread del server
app.keycloak.admin.connect-timeout-ms=${KEYCLOAK_ADMIN_CONNECT_TIMEOUT_MS:5000}
app.keycloak.admin.read-timeout-ms=${KEYCLOAK_ADMIN_READ_TIMEOUT_MS:10000}

# eta' massima dell'autenticazione (claim auth_time del token) perche' un'operazione sensibile
# sia ammessa senza rifare il login. Vale oggi per il cambio password: un access token rubato
# resta valido fino alla scadenza, e senza questo controllo basterebbe a prendersi l'account.
app.security.max-auth-age-seconds=${SECURITY_MAX_AUTH_AGE_SECONDS:300}

# rifiuta payload con campi non previsti dal DTO invece di ignorarli silenziosamente (mass assignment)
spring.jackson.deserialization.fail-on-unknown-properties=true

# rate limiting in-memory: richieste al minuto per utente autenticato (sub del token) / per IP
app.ratelimit.authenticated.capacity=${RATELIMIT_AUTHENTICATED_CAPACITY:60}
app.ratelimit.anonymous.capacity=${RATELIMIT_ANONYMOUS_CAPACITY:20}

# paginazione: dimensione di default e tetto massimo applicato lato server (ignora richieste di size maggiore)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# limiti upload: primo sbarramento, applicato da Spring prima ancora che la richiesta
# arrivi al controller. Il controllo sulla dimensione e' ripetuto in ImmagineStorageService,
# che non deve dipendere da questa property per essere sicuro.
spring.servlet.multipart.max-file-size=5MB
# leggermente sopra il limite del singolo file: nella richiesta multipart, oltre al file, ci
# sono gli header delle parti. Con lo stesso valore un file da esattamente 5MB verrebbe
# rifiutato per un pugno di byte di overhead.
spring.servlet.multipart.max-request-size=6MB

# --- Storage delle immagini caricate dagli utenti -----------------------------------------
# I file NON stanno nel database e NON sono serviti come risorse statiche: sono restituiti
# solo dall'endpoint autenticato /api/immagini/{id}/contenuto, qualunque sia lo storage.
#
# Dove finiscono i byte: "filesystem" (disco locale) oppure "s3" (object storage esterno
# compatibile S3, per esempio Cloudflare R2). Il default resta il disco perche' i test e
# chiunque cloni il repo devono poter lavorare senza credenziali di un servizio esterno.
app.storage.immagini.tipo=${APP_STORAGE_IMMAGINI_TIPO:filesystem}
# Cartella base, usata solo con tipo=filesystem. In produzione va su un volume dedicato,
# fuori dalla directory dell'applicazione (idealmente su un filesystem separato: cosi' un
# upload che riempie il disco non ferma l'applicazione): il default e' comodo solo in locale.
app.storage.immagini.path=${APP_STORAGE_IMMAGINI_PATH:./storage-immagini}

# --- Object storage esterno (usato solo con app.storage.immagini.tipo=s3) -----------------
# Nessun default per endpoint, bucket e credenziali: con tipo=s3 l'applicazione NON parte se
# manca uno di questi valori, invece di accorgersene al primo upload. Le credenziali si
# passano solo da variabile d'ambiente, mai scritte qui.
# Cloudflare R2: l'endpoint e' https://<account-id>.r2.cloudflarestorage.com e la region
# vale sempre "auto" (R2 non ha regioni, ma la firma S3 richiede il campo valorizzato).
app.storage.immagini.s3.endpoint=${APP_STORAGE_S3_ENDPOINT:}
app.storage.immagini.s3.bucket=${APP_STORAGE_S3_BUCKET:}
app.storage.immagini.s3.region=${APP_STORAGE_S3_REGION:auto}
app.storage.immagini.s3.access-key-id=${APP_STORAGE_S3_ACCESS_KEY_ID:}
app.storage.immagini.s3.secret-access-key=${APP_STORAGE_S3_SECRET_ACCESS_KEY:}
# limite di dimensione applicato dal service (5 MB)
app.storage.immagini.max-size-byte=${APP_STORAGE_IMMAGINI_MAX_SIZE_BYTE:5242880}
# lato massimo in pixel: difesa contro le "decompression bomb", immagini di pochi KB che
# dichiarano risoluzioni enormi e saturano la memoria di chi le apre
app.storage.immagini.max-lato-pixel=${APP_STORAGE_IMMAGINI_MAX_LATO_PIXEL:10000}
# quante immagini al massimo si possono allegare a una singola recensione o a un singolo
# itinerario: senza un tetto, un solo utente potrebbe riempire lo storage restando
# comodamente dentro il limite del singolo file
app.storage.immagini.max-per-risorsa=${APP_STORAGE_IMMAGINI_MAX_PER_RISORSA:10}
# prefisso degli URL restituiti al client: se un giorno i file passassero su un CDN o su un
# object storage, cambia solo questo valore
app.storage.immagini.base-url=${APP_STORAGE_IMMAGINI_BASE_URL:/api/immagini}
# timeout della sola transazione che imposta la foto profilo: al suo interno c'e' la
# scrittura su object storage, cioe' rete, e il default di 10 secondi qui sotto e' tarato
# invece su transazioni che parlano solo col database. Su una connessione domestica un
# upload puo' passare comodamente i dieci secondi, e la transazione moriva a meta'
app.storage.immagini.upload-timeout-secondi=${APP_STORAGE_IMMAGINI_UPLOAD_TIMEOUT_SECONDI:60}

# timeout: evita che una transazione/query anomala tenga bloccata una connessione a lungo
spring.transaction.default-timeout=10
spring.jpa.properties.hibernate.query.timeout=10000

# baseline sicura di default: niente stack trace / messaggio grezzo nelle risposte di errore.
# Il profilo "dev" (application-dev.properties) puo' rilassare questi valori per debug locale;
# di proposito NON e' il profilo attivo di default, va impostato esplicitamente.
server.error.include-stacktrace=never
server.error.include-message=never

# traceId nei log di console, per correlare un errore riportato dall'utente col relativo log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [traceId=%X{traceId:-}] ${PID:- } --- [%15.15t] %-40.40logger{39} : %m%n

# CORS: allow-list esplicita (mai '*'), nessuna credenziale cross-origin (bearer token, non cookie).
# Il default qui e' un placeholder per lo sviluppo locale: in produzione VA impostato con il/i
# dominio/i reali del frontend tramite la variabile d'ambiente CORS_ALLOWED_ORIGINS.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# HTTPS non forzato di default (in dev Keycloak gira su HTTP): il profilo prod lo attiva esplicitamente.
app.security.require-https=false


# --- Notifiche in-app ---------------------------------------------------------------------
# Job giornaliero che invita a recensire i viaggi conclusi il giorno prima. E' idempotente:
# non crea l'invito se ne esiste gia' uno per quella prenotazione o se l'utente ha gia'
# recensito, quindi puo' essere rieseguito senza generare duplicati.
app.notifiche.invito-recensione.cron=${NOTIFICHE_INVITO_RECENSIONE_CRON:0 0 9 * * *}
app.notifiche.invito-recensione.zona=${NOTIFICHE_INVITO_RECENSIONE_ZONA:Europe/Rome}
# interruttore generale dei job schedulati: i test lo spengono per invocarli a mano con una
# data scelta da loro, invece di dipendere dall'ora in cui girano
app.scheduling.enabled=${APP_SCHEDULING_ENABLED:true}
