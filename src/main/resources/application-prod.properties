# Profilo di produzione: va attivato esplicitamente (SPRING_PROFILES_ACTIVE=prod).
# Ribadisce esplicitamente i vincoli richiesti in produzione, anche se oggi coincidono
# con la baseline di application.properties, cosi' restano documentati e non dipendono
# da un default che in futuro potrebbe cambiare.

server.error.include-stacktrace=never
server.error.include-message=never

spring.jpa.show-sql=false
