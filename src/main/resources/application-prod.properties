# Profilo di produzione: va attivato esplicitamente (SPRING_PROFILES_ACTIVE=prod).
# Ribadisce esplicitamente i vincoli richiesti in produzione, anche se oggi coincidono
# con la baseline di application.properties, cosi' restano documentati e non dipendono
# da un default che in futuro potrebbe cambiare.

server.error.include-stacktrace=never
server.error.include-message=never

spring.jpa.show-sql=false

# HTTPS obbligatorio: ogni richiesta non su canale sicuro viene rifiutata (vedi SecurityConfig)
app.security.require-https=true

# dietro un reverse proxy/load balancer che termina il TLS, cosi' Spring vede lo schema/host
# originali (X-Forwarded-*) invece di trattare tutto come HTTP semplice
server.forward-headers-strategy=framework

# swagger-ui e la specifica OpenAPI non devono essere esposti pubblicamente in produzione
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
