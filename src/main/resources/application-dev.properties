# Profilo di sviluppo locale: NON e' attivo di default, va impostato esplicitamente
# (es. SPRING_PROFILES_ACTIVE=dev). La baseline in application.properties resta quella
# sicura; qui si rilassano solo i controlli utili per il debug in locale.

spring.jpa.show-sql=true

# messaggio di errore leggibile durante lo sviluppo (mai lo stack trace, comunque)
server.error.include-message=always
