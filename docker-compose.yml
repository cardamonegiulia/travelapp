services:

  backend:
    build: .
    container_name: travelapp-backend
    ports:
      - "8081:8081"

    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # L'issuer deve coincidere ESATTAMENTE con il claim "iss" del token.
      # KEYCLOAK_PUBLIC_URL è l'indirizzo pubblico con cui Android raggiunge Keycloak.
      OAUTH2_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8090}/realms/travelapp

      # Il backend scarica invece le chiavi usando la rete interna Docker.
      OAUTH2_JWK_SET_URI: http://travelapp-keycloak:8080/realms/travelapp/protocol/openid-connect/certs

      # Admin REST API di Keycloak: anche questa usa la rete interna Docker.
      KEYCLOAK_BASE_URL: http://travelapp-keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}

      APP_STORAGE_IMMAGINI_PATH: /var/travelapp/immagini
      # Storage immagini su Cloudflare R2 / S3
      APP_STORAGE_IMMAGINI_TIPO: ${APP_STORAGE_IMMAGINI_TIPO:-filesystem}
      APP_STORAGE_S3_ENDPOINT: ${APP_STORAGE_S3_ENDPOINT:-}
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-}
      APP_STORAGE_S3_ACCESS_KEY_ID: ${APP_STORAGE_S3_ACCESS_KEY_ID:-}
      APP_STORAGE_S3_SECRET_ACCESS_KEY: ${APP_STORAGE_S3_SECRET_ACCESS_KEY:-}

    volumes:
      # Cartella del repo, non un volume anonimo di Docker: il backend puo' girare
      # in container oppure direttamente dall'IDE (dove il default e'
      # ./storage-immagini) e in entrambi i casi legge e scrive gli stessi file.
      # Con un volume nominato i due modi avevano due archivi separati, e le
      # immagini caricate in un modo davano 404 nell'altro.
      # La cartella e' in .gitignore, quindi non finisce sotto controllo di versione.
      - ./storage-immagini:/var/travelapp/immagini

    depends_on:
      - keycloak


  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: travelapp-keycloak

    ports:
      - "8090:8080"

    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      # Issuer pubblico fisso.
      # Con adb reverse può restare localhost.
      # Senza adb reverse va impostato KEYCLOAK_PUBLIC_URL nel .env
      # con l'IP LAN del PC.
      KC_HOSTNAME_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8090}
      KC_HOSTNAME_ADMIN_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8090}

    command: start-dev --import-realm

    volumes:
      - ./keycloak-import:/opt/keycloak/data/import
      # Dati interni di Keycloak (utenti, credenziali, sessioni): senza questo volume
      # vivono solo nel filesystem del container e spariscono a ogni `docker compose down`.
      - keycloak_data:/opt/keycloak/data

    depends_on:
      - mailpit


  mailpit:
    image: axllent/mailpit:v1.20
    container_name: travelapp-mailpit

    ports:
      - "8025:8025"
      - "1025:1025"


volumes:
  keycloak_data: